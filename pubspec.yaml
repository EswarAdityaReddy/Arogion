name: arogion_main_mvp
description: "A Flutter authentication app with Firebase and Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # Supabase
  supabase_flutter: ^2.8.3

  # UI & Utils
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0
  lottie: ^3.1.2
  qr_flutter: ^4.1.0
  uuid: ^4.0.0
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
